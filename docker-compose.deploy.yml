name: oratoriaai-demo

x-deploy-logging: &deploy-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    mem_limit: 512m
    logging: *deploy-logging
  ollama:
    mem_limit: 2560m
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 2m
    logging: *deploy-logging
  ai-service:
    mem_limit: 2g
    environment:
      INFERENCE_THREADS: "2"
    logging: *deploy-logging
  backend:
    mem_limit: 1g
    environment:
      APP_PROFILE: ${APP_PROFILE:-demo}
      CORS_ALLOWED_ORIGIN: ${PUBLIC_ORIGIN:?Define PUBLIC_ORIGIN en .env}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:+ExitOnOutOfMemoryError
    logging: *deploy-logging
  frontend:
    mem_limit: 128m
    volumes:
      - ./deploy/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *deploy-logging
