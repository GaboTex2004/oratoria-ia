services:
  postgres:
    image: postgres:17
    container_name: oratoria_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oratoria_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    volumes:
      - oratoria_postgres_data:/var/lib/postgresql/data

volumes:
  oratoria_postgres_data:
