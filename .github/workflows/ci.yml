name: Verify OratoriaAI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run lint && npm run build
        working-directory: frontend
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: ai-service
      - run: python -m ruff check app tests scripts && python -m ruff format --check app tests scripts && python -m pytest -m 'not models' -q
        working-directory: ai-service
  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: oratoria_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d oratoria_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/oratoria_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash mvnw -B verify
        working-directory: backend
