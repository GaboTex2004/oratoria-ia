spring.application.name=backend
spring.profiles.active=${APP_PROFILE:default}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5435/oratoria_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=${AUDIO_MAX_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${AUDIO_MAX_REQUEST_SIZE:16MB}

server.port=${SERVER_PORT:8081}
app.billing.demo-enabled=${BILLING_DEMO_ENABLED:false}
app.billing.premium-price=${BILLING_PREMIUM_PRICE:49.00}
app.billing.grace-days=${BILLING_GRACE_DAYS:3}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
app.ai-service.internal-api-key=${INTERNAL_API_KEY:${AI_SERVICE_INTERNAL_API_KEY:}}
app.ai-service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:300}
app.analysis.async-enabled=${ANALYSIS_ASYNC_ENABLED:true}
app.analysis.max-attempts=${ANALYSIS_MAX_ATTEMPTS:5}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.first-name=${ADMIN_FIRST_NAME:Administrador}
app.admin.last-name=${ADMIN_LAST_NAME:Oratoria IA}
app.audio.storage-dir=${AUDIO_STORAGE_DIR:./data/audio}
app.audio.max-size-bytes=${AUDIO_MAX_SIZE_BYTES:15728640}
app.audio.max-duration-seconds=${AUDIO_MAX_DURATION_SECONDS:300}
