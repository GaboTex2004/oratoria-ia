spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/oratoria_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8081}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.first-name=${ADMIN_FIRST_NAME:Administrador}
app.admin.last-name=${ADMIN_LAST_NAME:Oratoria IA}
