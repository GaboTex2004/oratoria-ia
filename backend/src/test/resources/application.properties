app.jwt.secret=test-only-secret-that-is-longer-than-32-characters
app.jwt.expiration-ms=86400000
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://127.0.0.1:5435/oratoria_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false
app.cors.allowed-origin=http://localhost:5173,http://127.0.0.1:5173
app.ai-service.url=http://localhost:8000
app.ai-service.internal-api-key=test-internal-service-key
app.ai-service.timeout-seconds=10
app.analysis.async-enabled=false
app.analysis.max-attempts=3
app.admin.email=
app.admin.password=
app.admin.first-name=Test
app.admin.last-name=Admin
app.audio.storage-dir=./target/test-audio
app.audio.max-size-bytes=5242880
app.audio.max-duration-seconds=300
